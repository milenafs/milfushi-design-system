name: Deploy Documentation

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Pushes the built site to the gh-pages branch, which is also where pull
# request previews live. Pages must be configured to deploy from that branch.
permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci

      - name: Generate Component Docs
        run: npm run generate-docs

      - name: Build UI package
        run: npm run build --workspace=packages/ui

      - name: Build documentation
        run: npm run build --workspace=apps/docs

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: apps/docs/build
          branch: gh-pages
          # Keep open pull request previews; rebase rather than force-push so
          # a release deploy cannot clobber a preview deployed alongside it.
          clean-exclude: pr-preview
          force: false
